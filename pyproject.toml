[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "commonmemo"
version = "0.0.1"
description = "Framework-neutral memory for agents and workflows: event, session, episodic and user memory behind one handle."
dynamic = ["readme"]
license = "Apache-2.0"
keywords = ["agents", "memory", "llm", "mcp", "claude-code", "codex", "rag", "event-log", "postgres", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
authors = [
    { name = "Mehul Gupta", email = "mehulgupta85@gmail.com" },
]
# The core is stdlib-only (sqlite3, dataclasses): installing and using
# commonmemo with the local engine needs nothing else. Engines and
# integrations bring their own dependencies through extras.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]
commonadk = [
    "commonadk>=0.0.2",
]
# Framework-native adapters (#6): CommonMemo behind each SDK's own memory or session interface.
adk = [
    "google-adk>=2.13; python_version >= '3.11'",
]
openai-agents = [
    "openai-agents>=0.24",
]
graphiti = [
    "graphiti-core>=0.31",
    # graphiti-core imports httpx (llm_client/client.py) without declaring
    # it; it used to arrive through openai, but openai 3.x moved to httpx2,
    # so without this `import graphiti_core` raises ModuleNotFoundError.
    "httpx",
]
mem0 = [
    "mem0ai>=2.2",
]
# The MCP server (`commonmemo mcp`) is stdlib-only; this extra only brings
# the official MCP client, for the interoperability test.
mcp = [
    "mcp>=2",
]
# Postgres for the Log, the projections and the local engine's recaps
# (`postgresql://...` store URLs; ADR 0001).
postgres = [
    "psycopg[binary]>=3.1",
]
# Turn traces as OpenTelemetry spans (commonmemo.otel); add your own exporter.
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.urls]
Homepage = "https://github.com/Mehul-Gupta-SMH/CommonMemO"
Documentation = "https://github.com/Mehul-Gupta-SMH/CommonMemO/blob/main/docs/design.md"
Source = "https://github.com/Mehul-Gupta-SMH/CommonMemO"
Issues = "https://github.com/Mehul-Gupta-SMH/CommonMemO/issues"
Changelog = "https://github.com/Mehul-Gupta-SMH/CommonMemO/blob/main/CHANGELOG.md"
Sample = "https://mehul-gupta-smh.github.io/CommonMemO/"

[project.scripts]
commonmemo = "commonmemo.cli:main"

# The README on PyPI has no repository around it, so its relative images and links become GitHub URLs when
# the package is built; the README in the repository is untouched.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''src="(docs/assets/[^"]+)"'''
replacement = 'src="https://raw.githubusercontent.com/Mehul-Gupta-SMH/CommonMemO/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''\]\(((?:\.\./)?(?:docs|examples|scripts|evals|pages|src|tests)/[^)]*|LICENSE|CHANGELOG\.md)\)'''
replacement = '](https://github.com/Mehul-Gupta-SMH/CommonMemO/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/commonmemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The evaluation suite (evals/) lives beside src/, outside the package.
pythonpath = ["."]
