name: CI

# core: no extras -- proves the core is stdlib-only (the CommonADK
#   integration test skips itself via pytest.importorskip).
# commonadk: with the commonadk extra -- runs the integration against
#   CommonADK's real event model and HookRegistry.
# graphiti: with the graphiti extra -- runs GraphitiBackend against
#   graphiti-core's real types (no graph database or LLM needed).
# mem0: with the mem0 extra -- binds AsyncMemoryBackend's calls against
#   mem0's real AsyncMemory signatures (no LLM or vector store needed).
# mcp,otel: drives `commonmemo mcp` over stdio with the official MCP client
#   (the server itself needs no extra), and checks turn traces as OpenTelemetry spans.
# postgres: the whole suite again with every store, projection and recap index
#   on Postgres 16 (COMMONMEMO_TEST_POSTGRES; see tests/conftest.py), plus the
#   Postgres-only tests (concurrent writer processes, schemas).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        extras: ["dev", "dev,commonadk", "dev,adk", "dev,openai-agents", "dev,langgraph", "dev,autogen", "dev,graphiti", "dev,mem0", "dev,mcp,otel"]
        exclude:
          - python: "3.10"  # google-adk 2 needs Python 3.11
            extras: "dev,adk"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: python -c "import sys, commonmemo, commonmemo.sqldb, commonmemo.stores, commonmemo.adapters, commonmemo.engines.graphiti, commonmemo.engines.mem0, commonmemo.mcp, commonmemo.otel, commonmemo.views; assert not any(m.split('.')[0] in ('commonadk', 'graphiti_core', 'mem0', 'mcp', 'opentelemetry', 'psycopg') for m in sys.modules)"
      - run: pytest -q
      # The whole suite again with every Memory reading its projections only through the Projections interface (#52).
      - run: pytest -q
        if: matrix.extras == 'dev'
        env:
          COMMONMEMO_TEST_INTERFACE: "1"

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,postgres]"
      # Tests open many short-lived memories; give the server room.
      - run: |
          psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 1000"
          docker restart ${{ job.services.postgres.id }}
          until pg_isready -h localhost -U postgres; do sleep 1; done
      - run: pytest -q
        env:
          COMMONMEMO_TEST_POSTGRES: postgresql://postgres@localhost:5432/postgres
